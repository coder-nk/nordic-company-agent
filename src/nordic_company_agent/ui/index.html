<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signalpost · Norwegian company intelligence</title>
<meta name="description" content="Verified company profiles for Norwegian organisation numbers. Every fact linked to its source.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i class="c1"></i><i class="c2"></i><i class="c3"></i></div>
<svg width="0" height="0" style="position:absolute;width:0;height:0" aria-hidden="true">
  <defs>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8d5e2"/><stop offset="1" stop-color="#3ddc97"/></linearGradient>
    <linearGradient id="barg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8d5e2"/><stop offset="1" stop-color="#a8d5e2" stop-opacity=".28"/></linearGradient>
  </defs>
</svg>

<nav class="nav" aria-label="Main">
  <div class="nav-inner glass">
    <a class="brand" href="#/" aria-label="Signalpost home">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l3-7 4 14 3-7h5"/></svg></span>
      <span><b>Signalpost</b><small>Company intelligence · Norway</small></span>
    </a>
    <div class="tabs" role="tablist">
      <a class="tab" data-tab="home" href="#/">Overview</a>
      <a class="tab" data-tab="companies" href="#/companies">Companies</a>
      <a class="tab" data-tab="research" href="#/research">Research</a>
      <a class="tab" data-tab="compare" href="#/compare">Compare</a>
      <a class="tab" data-tab="about" href="#/about">How it works</a>
    </div>
    <div class="nav-right">
      <button class="kbtn" id="openPal" type="button" aria-label="Search companies">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="t">Search name or org. number…</span><kbd>Ctrl K</kbd>
      </button>
      <button class="icon-btn" id="theme" type="button" aria-label="Toggle light and dark theme"></button>
    </div>
  </div>
</nav>

<main id="app" class="wrap" aria-live="polite"></main>

<footer><div class="wrap">
  <span>Signalpost · built only on official Norwegian open data and the companies' own websites. No AI-generated facts.</span>
  <span id="footStats"></span>
</div></footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer glass" id="drawer" role="dialog" aria-modal="true" aria-label="Fact and source"></aside>
<div class="pal glass" id="pal" role="dialog" aria-modal="true" aria-label="Search">
  <div class="in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="palIn" placeholder="Company name, org. number or town…" autocomplete="off" spellcheck="false"><kbd>Esc</kbd></div>
  <div class="res" id="palRes"></div>
  <div class="foot"><span>↑↓ to move</span><span>↵ to open</span><span>Type a 9-digit number to research any company</span></div>
</div>
<div class="toast glass" id="toast" role="status"></div>
<div class="tray glass" id="tray" aria-label="Compare tray"></div>
<script src="/app.js"></script>
</body>
</html>
